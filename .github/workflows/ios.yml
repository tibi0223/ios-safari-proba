name: ios-safari
on:
  workflow_dispatch:
    inputs:
      ujratoltes:
        description: reloads per variant
        default: "12"
jobs:
  proba:
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - run: pip3 install --break-system-packages selenium==4.27.1 || pip3 install selenium==4.27.1
      - run: bash proba2.sh "${{ github.event.inputs.ujratoltes || '12' }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eredmeny
          path: ki/
